<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Учёт кардиологических пациентов</title>
  </head>
  <body>
    <form id="patient-form">
      <label>ФИО:<input type="text" id="full-name" required /></label>
      <label
        >Возраст:<input
          type="number"
          id="age"
          required
          min="0"
          max="120" /></label
      ><br />
      <label>Диагноз:<input type="text" id="diagnosis" required /></label>
      <label>Экстренный:<input type="checkbox" id="is-emergency" /></label
      ><br />
      <label
        >Тип исследования:<select id="patient-type" required>
          <option value="">--Выберите тип исследования--</option>
          <option value="holter">Холтер-мониторинг</option>
          <option value="ekg">Стандартная ЭКГ</option>
        </select></label
      ><br />
      <div id="holter-fields" style="display: none">
        <label
          >Длительность мониторинга(часы):<input
            type="number"
            id="monitor-duration"
            min="1"
            max="72" /></label
        ><br />
        <label
          >Максимальная ЧСС:
          <input type="number" id="max-heart-rate" min="30" max="300" /></label
        ><br />
      </div>
      <div id="ekg-fields" style="display: none">
        <label>Тип ритма:<input type="text" id="rhythm-type" /></label><br />
        <label
          >Элевация ST:
          <input type="checkbox" id="st-segment-elevation" /></label
        ><br />
      </div>

      <button type="submit">Сохранить</button>
    </form>
    <table id="patient-table" border="1">
      <thead>
        <tr>
          <th>ФИО</th>
          <th>Возраст</th>
          <th>Диагноз</th>
          <th>Экстренный</th>
          <th>Тип</th>
          <th>Доп.информация</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <script src="script.js"></script>
  </body>
</html>
